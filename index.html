 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
 </head>
 <body>
    <div class="body-container">
       <div class="image-container">
        <img src="./images/halie-west-25xggax4bSA-unsplash.jpg" alt="" class="header-picture">
         <div class="logo-container">
              <img src="./images/odin-logo.png" alt="" class="logo-image">
              <span class="odin-logo-text">ODIN</span>
        </div>
       </div> 
       <div class="form-container">
         <div class="form-container-info">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>
            <p>Sign up <i>now</i> to get started.</p>
            <p id="form-container-info-standalone">You <i>know</i> you want to.</p>
         </div>
         <div class="signup-form-container">
            <form action="#">
                <p style="color: rgb(57, 57, 57);;"><b>Let's do this!</b></p>
                <div class="two-inputs">
                    <div class="label-input">
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name" name="first-name" required>
                    </div>
                    <div class="label-input">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" name="last-name" required>
                    </div>
                </div>
                <div class="two-inputs">
                    <div class="label-input">
                        <label for="email-address">EMAIL</label>
                        <input type="email" id="email-address" name="email-address" required>
                    </div>
                    <div class="label-input">
                        <label for="phone-number">PHONE NUMBER</label>
                        <input type="number" id="phone-number" name="phone-number" required>
                    </div>
                </div>
                <div class="two-inputs">
                    <div class="label-input">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password-list" required>
                    </div>
                    <div class="label-input">
                        <label for="password-confirm">CONFIRM PASSWORD</label>
                        <input type="password" id="password-confirm" name="password-list" required>
                    </div>
                </div>
            </form>
         </div>
         <div class="foot">
            <div><button type="submit">Create Account</button></div>
            <div><p class="login-paragraph">Already have an account? <a href="#" class="log-in">Log in</a></p></div>
         </div>
        </div>
    </div>
 </body>
 </html>
